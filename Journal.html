<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Reflective Journal</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f8ff;
      padding: 20px;
    }
    h1 { color: #004d66; text-align: center; }
    .journal-entry {
      background: #fff;
      border: 2px solid #0077cc;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 2px 2px 8px rgba(0,0,0,0.1);
    }
    label {
      font-weight: bold;
      display: block;
      margin-top: 10px;
    }
    textarea {
      width: 100%;
      height: 80px;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 8px;
    }
    button {
      margin-top: 10px;
      padding: 8px 16px;
      background: #0077cc;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover { background: #005580; }
    .saved-entry {
      background: #e6f7ff;
      border-left: 5px solid #0077cc;
      margin-top: 10px;
      padding: 10px;
      border-radius: 6px;
    }
    .date {
      font-size: 0.9em;
      color: #666;
    }
    .header-img {
      display: block;
      margin: 0 auto 20px auto;
      width: 200px;
      border-radius: 12px;
    }
  </style>
</head>
